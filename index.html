<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大小くらべトロッコ｜レベル選択</title><style>:root{--navy:#101e32;--cream:#fff8e9;--gold:#f7bc4b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 5%,#294661,#101e32 65%);color:var(--cream);font-family:system-ui,"Noto Sans JP",sans-serif;min-height:100vh}.wrap{width:min(900px,100%);margin:auto;padding:40px 20px 70px}.eyebrow{color:var(--gold);font-size:13px;letter-spacing:.2em;font-weight:800}.head{text-align:center;margin:55px auto 42px}.head h1{font-size:clamp(30px,7vw,52px);margin:12px 0}.head p{line-height:1.8;color:#c5d8d8}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{display:flex;flex-direction:column;gap:16px;padding:30px 26px;border:2px solid #658492;background:#1b3145;color:inherit;border-radius:24px;text-decoration:none;min-height:270px;box-shadow:0 16px 50px #07152366}.card:hover,.card:focus-visible{border-color:var(--gold);transform:translateY(-3px)}.tag{color:var(--gold);font-weight:800}.card h2{font-size:28px;margin:0}.card p{line-height:1.75;color:#d1dfdd;margin:0;flex:1}.go{align-self:flex-start;border-radius:12px;padding:10px 18px;color:#172333;background:var(--gold);font-weight:800}@media(max-width:620px){.grid{grid-template-columns:1fr}.head{margin:30px auto}.card{min-height:210px}}@media(prefers-reduced-motion:reduce){.card{transition:none}}</style></head><body><div class="wrap"><div class="eyebrow">◆ NUMBER ADVENTURE</div><header class="head"><h1>大小くらべトロッコ</h1><p>大きい数を選んで、ゴールを目指そう。レベルを選んで始めます。</p></header><main class="grid"><a class="card" href="beginner.html"><span class="tag">LEVEL 1</span><h2>基本</h2><p>同じ底の指数を比べる。底が1より大きいか小さいかにも注目しよう。</p><span class="go">基本で遊ぶ →</span></a><a class="card" href="advanced.html"><span class="tag">LEVEL 2</span><h2>上級</h2><p>8＝2³ のように整数を累乗の形へ直し、指数をそろえて比べる。</p><span class="go">上級で遊ぶ →</span></a></main></div></body></html>
